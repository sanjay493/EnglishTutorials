name: Daily lesson (optional)

# This workflow is for people who want the course to grow without opening a
# terminal. It needs a provider key in repository secrets and a model in
# repository variables. See AUTOMATION.md before enabling the schedule.
#
# Pushes made with the workflow's GITHUB_TOKEN do not trigger other workflows,
# so this file deploys the site itself at the end.

on:
  workflow_dispatch:
    inputs:
      lessons:
        description: "Maximum lessons this run (1-3)"
        required: false
        default: "1"
  # Uncomment to write one lesson every day at 03:30 UTC:
  # schedule:
  #   - cron: "30 3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Configure git identity
        run: |
          git config user.name "lesson-writer[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Write the next lesson
        env:
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          opencode run --agent lesson-writer \
            --model "$OPENCODE_MODEL" \
            "Write at most ${{ github.event.inputs.lessons || '1' }} lesson(s) within today's budget."

      - name: Rebuild generated files and validate
        run: node scripts/build-all.mjs

      - name: Commit and push any remaining changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "lesson: automated run $(date -u +%F)"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
